<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VoxFit AI</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #121212; color: white; text-align: center; padding: env(safe-area-inset-top) 20px 20px 20px; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .card { background: #1e1e1e; padding: 40px 20px; border-radius: 30px; border: 1px solid #333; }
        button { background: #007aff; color: white; border: none; padding: 25px; border-radius: 20px; font-size: 20px; font-weight: bold; width: 100%; box-shadow: 0 4px 15px rgba(0,122,255,0.3); }
        .status { margin-top: 30px; color: #00ff00; font-weight: 500; min-height: 1.5em; }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="font-size: 2.5em; margin-bottom: 10px;">VOXFIT AI</h1>
        <p style="color: #aaa; margin-bottom: 40px;">Assistant Vocal International</p>
        
        <button onclick="declencherBriefing()">JE SUIS À LA SALLE</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // Enregistrement de la PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const seanceDuJour = {
            nom: "Séance A - Pousse",
            muscles: ["Pectoraux", "Triceps"],
            nbExercices: 5
        };

        function declencherBriefing() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Coaching en cours...";

            const texte = `Salut ! Bienvenue à la salle. Aujourd'hui, on s'attaque à la ${seanceDuJour.nom}. On va bosser les ${seanceDuJour.muscles.join(' et ')}. Prêt à donner ton maximum ?`;

            const synthese = window.speechSynthesis;
            const parole = new SpeechSynthesisUtterance(texte);
            parole.lang = 'fr-CA';
            parole.rate = 0.9;

            synthese.speak(parole);
        }
    </script>
</body>
</html>
